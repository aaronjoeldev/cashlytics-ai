# Builds the image from this checkout and runs it with a local PostgreSQL.
#
#   docker compose up -d --build     app on http://localhost:3000
#   docker compose up -d postgres    database only, for `npm run dev` (see scripts/dev.sh)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-de}
        NEXT_PUBLIC_DEFAULT_CURRENCY: ${NEXT_PUBLIC_DEFAULT_CURRENCY:-EUR}
    container_name: cashlytics-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # The app reaches the database over the compose network, not via localhost
      - DATABASE_URL=postgresql://cashlytics:cashlytics_secret@postgres:5432/cashlytics
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - SINGLE_USER_MODE=${SINGLE_USER_MODE:-true}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine localhost resolves to ::1 first, and the server
      # listens on IPv4 only, so the check never passed and dependent services never started
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cashlytics-cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
      APP_URL: http://app:3000
      NOTIFICATION_SCHEDULE: ${NOTIFICATION_SCHEDULE:-0 8 * * *}
      # Insights for the AI assistant (default 06:00 UTC daily)
      INSIGHTS_SCHEDULE: ${INSIGHTS_SCHEDULE:-0 6 * * *}
    depends_on:
      app:
        condition: service_healthy
    command: >
      sh -c "apk add --no-cache curl --quiet &&
             printf '%s\\n' \"$$NOTIFICATION_SCHEDULE curl -s -H 'Authorization: Bearer $$CRON_SECRET' $$APP_URL/api/cron/upcoming-payments >> /var/log/cron.log 2>&1\" \"$$INSIGHTS_SCHEDULE curl -s -H 'Authorization: Bearer $$CRON_SECRET' $$APP_URL/api/cron/insights >> /var/log/cron.log 2>&1\" | crontab - &&
             crond -f -l 2"

  postgres:
    image: postgres:16-alpine
    container_name: cashlytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cashlytics
      POSTGRES_PASSWORD: cashlytics_secret
      POSTGRES_DB: cashlytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashlytics -d cashlytics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
